<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Wärmepumpe</title>
    <script>
      // Pick the right background before the theme plugin loads, to avoid a white flash in dark mode.
      try {
        const s = localStorage.getItem("theme.scheme");
        const dark = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.style.background = dark ? "#111" : "#fafafa";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
