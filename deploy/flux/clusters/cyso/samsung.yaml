# Apply once: kubectl apply -f deploy/flux/clusters/cyso/samsung.yaml
# The Cyso cluster already runs CloudNativePG (cnpg-system/cloudnative-pg, managed
# by the cluster's own Flux fleet), so this does NOT deploy deploy/infrastructure/cnpg.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: samsung
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/malagant/samsung
  ref: { branch: main }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: samsung-tailscale
  namespace: flux-system
spec:
  interval: 1h
  sourceRef: { kind: GitRepository, name: samsung }
  path: ./deploy/infrastructure/tailscale
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef: { name: sops-age }
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: samsung
  namespace: flux-system
spec:
  dependsOn:
    - name: samsung-tailscale
  interval: 10m
  sourceRef: { kind: GitRepository, name: samsung }
  path: ./deploy/k8s/overlays/cyso
  prune: true
  wait: true
  timeout: 5m
  decryption:
    provider: sops
    secretRef: { name: sops-age }
