# Tailscale Kubernetes operator: exposes services to the tailnet only (no public endpoint).
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 24h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.4
      sourceRef: { kind: HelmRepository, name: tailscale }
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # OAuth credentials come from the SOPS-encrypted secret "operator-oauth".
    operatorConfig:
      hostname: cyso-k8s-operator
      defaultTags: [tag:k8s-operator]
    proxyConfig:
      defaultTags: tag:k8s
