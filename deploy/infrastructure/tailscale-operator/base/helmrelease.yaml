apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 1h
  chart:
    spec:
      chart: tailscale-operator
      version: ">=1.80.0 <2.0.0"
      sourceRef: { kind: HelmRepository, name: tailscale }
  install:
    remediation: { retries: 3 }
  upgrade:
    remediation: { retries: 3 }
  # No oauth values here: the chart then reads the existing Secret
  # tailscale/operator-oauth, which the overlay ships SOPS-encrypted.
  values:
    operatorConfig:
      hostname: k8s-operator
