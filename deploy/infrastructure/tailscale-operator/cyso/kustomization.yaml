apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - operator-oauth.sops.yaml
patches:
  - target: { kind: HelmRelease, name: tailscale-operator }
    patch: |
      - op: replace
        path: /spec/values/operatorConfig/hostname
        value: k8s-operator-cyso
