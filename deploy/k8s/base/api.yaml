apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app.kubernetes.io/name: api }
spec:
  replicas: 1 # one poller per SmartThings account; scale only after adding leader election
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" in node:22-alpine; kubelet needs a numeric UID to verify non-root
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/malagant/samsung-api:latest
          ports:
            - { name: http, containerPort: 8787 }
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: db-app, key: uri }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app.kubernetes.io/name: api }
  ports:
    - { name: http, port: 8787, targetPort: http }
