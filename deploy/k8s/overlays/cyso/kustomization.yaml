# Cyso Cloud: internal only. No Ingress; open the app with
#   kubectl -n samsung port-forward svc/web 8080:80
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: samsung
resources:
  - ../../base
  - secrets.sops.yaml
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - API_PUBLIC_URL=http://localhost:8080/api
      - WEB_PUBLIC_URL=http://localhost:8080
      - CORS_ORIGINS=http://localhost:8080
      - SMARTTHINGS_REDIRECT_URI=http://localhost:8080/api/auth/smartthings/callback
images:
  - name: ghcr.io/malagant/samsung-api
    newTag: latest
  - name: ghcr.io/malagant/samsung-web
    newTag: latest
patches:
  - target: { kind: Ingress, name: web }
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: web
