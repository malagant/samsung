# Encrypt before committing real values:
#   sops --encrypt --in-place deploy/k8s/overlays/home/secrets.sops.yaml
# Flux decrypts it with the age key stored in the cluster (secret sops-age).
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
type: Opaque
stringData:
  SESSION_SECRET: change-me
  SMARTTHINGS_CLIENT_ID: change-me
  SMARTTHINGS_CLIENT_SECRET: change-me
