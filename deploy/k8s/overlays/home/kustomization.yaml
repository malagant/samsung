apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: samsung
resources:
  - ../../base
  - secrets.sops.yaml
configMapGenerator:
  - name: api-config
    behavior: merge
    literals:
      - API_PUBLIC_URL=https://heatpump.example.com/api
      - WEB_PUBLIC_URL=https://heatpump.example.com
      - CORS_ORIGINS=https://heatpump.example.com
      - SMARTTHINGS_REDIRECT_URI=https://heatpump.example.com/api/auth/smartthings/callback
images:
  - name: ghcr.io/malagant/samsung-api
    newTag: latest
  - name: ghcr.io/malagant/samsung-web
    newTag: latest
patches:
  - target: { kind: Ingress, name: web }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: heatpump.example.com
