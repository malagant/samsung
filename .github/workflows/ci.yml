name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway CI database without a password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: samsung_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/samsung_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter "@samsung/api..." build
      - run: pnpm --filter @samsung/web build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize deploy/k8s/overlays/home | ./kubeconform -strict -ignore-missing-schemas -summary
          kubectl kustomize deploy/infrastructure/cnpg | ./kubeconform -strict -ignore-missing-schemas -summary
          kubectl kustomize deploy/infrastructure/tailscale-operator/base | ./kubeconform -strict -ignore-missing-schemas -summary

  images:
    if: github.event_name == 'push'
    needs: [check, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/samsung-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/samsung-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Pins the Cyso overlay to the images just built, so Flux rolls them out by
  # itself (no :latest, no manual restart). The commit uses GITHUB_TOKEN and
  # therefore does not start another workflow run.
  deploy-cyso:
    if: github.event_name == 'push'
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-cyso
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Pin image tags to ${{ github.sha }}
        env:
          TAG: ${{ github.sha }}
          FILE: deploy/k8s/overlays/cyso/kustomization.yaml
        run: |
          yq -i '(.images[] | select(.name == "ghcr.io/malagant/samsung-api" or .name == "ghcr.io/malagant/samsung-web")).newTag = strenv(TAG)' "$FILE"
          if git diff --quiet; then echo "already pinned"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${TAG::7} to Cyso [skip ci]"
          # main may have moved while the images were building.
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 5)); done
          exit 1
